<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login - SMS</title>
    <style>
        body { background-color: #f8f9fa; }
        .login-card { margin-top: 100px; border-radius: 15px; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4 mx-auto">
                <div class="card login-card shadow-lg p-4">
                    <h3 class="text-center text-primary fw-bold mb-4">🎓 SMS LOGIN</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            <input type="{{ field.field.widget.input_type }}" 
                                   name="{{ field.name }}" 
                                   class="form-control" 
                                   placeholder="Enter {{ field.label }}" required>
                        </div>
                        {% endfor %}

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-3 shadow-sm">Sign In</button>
                    </form>
                </div>
                <p class="text-center mt-3 text-muted small">&copy; 2026 Student Management System</p>
            </div>
        </div>
    </div>
</body>
</html>
