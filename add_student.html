<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Add Student</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4 border-0">
            <h3 class="mb-4 text-primary">Add New Student</h3>
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="roll" class="form-control mb-3" placeholder="Roll Number" required>
                <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>
                <input type="text" name="course" class="form-control mb-3" placeholder="Course Name" required>
                <button type="submit" class="btn btn-success w-100">Save Student</button>
                <a href="{% url 'home' %}" class="btn btn-link w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
